# Research pillars for Eunhan Ka's homepage.
# Each pillar lists the BibTeX keys (from _bibliography/papers.bib) it represents.
# Editing this file updates both the hero hover panel and the Research page.

common_foundation: "Network traffic dynamics"

education:
  - degree: "Ph.D."
    field: "Lyles School of Civil and Construction Engineering"
    institution: "Purdue University"
    date: "Dec 2025"
    note: "Dissertation: Physics-Informed Neural Networks for Secure Connected and Autonomous Traffic Modeling"
  - degree: "M.S."
    field: "Department of Civil and Environmental Engineering"
    institution: "Seoul National University"
    date: "Feb 2018"
  - degree: "B.S."
    field: "Department of Civil and Environmental Engineering"
    institution: "Seoul National University"
    date: "Feb 2016"

vision: >
  My research combines artificial intelligence, optimization, and network
  modeling to estimate transportation network states from incomplete
  observations, and to understand how the reliability of information shapes
  traveler behavior and network dynamics.

pillars:
  - id: estimation
    name: "Network Monitoring & State Estimation"
    icon: "fa-solid fa-brain"
    blurb: "Traffic-flow theory fused with learning to reconstruct network states from sparse observations."
    description: >
      I embed traffic-flow theory into machine learning so that network states
      can be reconstructed where sensing is incomplete. This work includes
      observation-aligned two-stage domain decomposition for speed-field
      reconstruction from sparse fixed sensors, physics-informed formulations of
      macroscopic models such as the generalized bathtub model, and graph
      learning guided by the network macroscopic fundamental diagram for traffic
      state imputation. The aim is inference that scales to large networks and
      stays reliable where data are limited.
    papers:
      - ka2026obsaligned
      - ka2024piml
      - xue2024nmfd

  - id: operations
    name: "Network Operations & Resilience"
    icon: "fa-solid fa-circle-nodes"
    blurb: "How disruptions propagate through networks, and how operations recover from them."
    description: >
      I study how transportation networks absorb disruption and how operations
      can be designed for faster recovery. This work quantifies how route
      guidance attacks and other disruptions propagate through a network, extends
      analytical network-flow models to traffic under manipulated guidance, and
      measures the network-level effects of operational changes such as movable
      lane management, connecting link-level intervention to network outcomes.
    papers:
      - ka2026resilience
      - ka2025analytical
      - ka2022lanemanagement

  - id: behavior
    name: "Traveler Behavior & Information Reliability"
    icon: "fa-solid fa-route"
    blurb: "How travelers respond when the information guiding them is unreliable."
    description: >
      I model how travelers respond to guidance they cannot fully trust. This
      work includes user-centered study of behavioral sensitivity to route
      guidance attacks, day-to-day network models in which trust in guidance is
      endogenous and reliance adapts over time, and empirical driver-behavior
      studies using surrogate safety measures, linking individual response to
      aggregate network dynamics.
    papers:
      - ka2025rga
      - ka_d2d_underreview
      - ka2020ssm

  - id: mobility
    name: "Connected & Automated Mobility and Cybersecurity"
    icon: "fa-solid fa-shield-halved"
    blurb: "Securing connected and automated mobility, from V2X messages to navigation services."
    description: >
      I model and mitigate cyber threats to connected and automated mobility.
      This work includes detection of V2X attacks such as fake emergency
      electronic brake light messages, bounded-rational route guidance attacks on
      urban navigation services, and a review of cybersecurity needs for
      next-generation road transportation, with defenses judged by their
      network-level outcomes rather than by detection accuracy alone.
    papers:
      - ka2026mirage
      - ukkusuri2025cyberreview
      - ka_fakerush
